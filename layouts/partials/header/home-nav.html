{{- $searchIcon := resources.Get "img/search.png" -}}
<nav class="home-image-nav" aria-label="主页导航">
  <ul>
    {{ range $identifier := slice "posts" "collection" "corner" "message" }}
    {{ range where site.Menus.main "Identifier" $identifier }}
      <li class="home-nav-{{ .Identifier }}">
        <a class="home-nav-link" href="{{ .URL | relLangURL }}"><span class="home-nav-label">{{ .Name }}</span></a>
      </li>
    {{ end }}
    {{ end }}
  </ul>
</nav>
<div class="home-image-tools">
  {{ partial "header/theme-button" . }}
  <button type="button" class="site-search-toggle" data-site-search-open aria-label="打开搜索" aria-expanded="false" data-hover-tooltip="虫眼鏡" data-hover-tooltip-delay="1000">
    <img class="site-search-icon" src="{{ $searchIcon.RelPermalink }}" alt="" loading="lazy">
  </button>
</div>

<style>
  #content .home-image-nav {
    position: absolute;
    inset: 0;
    z-index: 40;
    pointer-events: none;
  }

  #content .home-image-nav ul {
    position: absolute;
    inset: 0;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  #content .home-image-nav li {
    position: absolute;
    margin: 0;
    padding: 0;
  }

  #content .home-image-nav .home-nav-posts {
    left: 6%;
    bottom: 12%;
  }

  #content .home-image-nav .home-nav-corner {
    left: 65%;
    bottom: 11%;
  }

  #content .home-image-nav .home-nav-collection {
    left: 18%;
    bottom: 4%;
  }

  #content .home-image-nav .home-nav-message {
    right: 7%;
    bottom: 4%;
  }

  #content .home-image-nav .home-nav-link {
    display: inline-flex;
    pointer-events: auto;
    align-items: center;
    min-height: 2.5rem;
    padding: 0.25rem 0.5rem;
    color: #4b5563;
    font-size: 1.08rem;
    font-weight: 600;
    line-height: 1.5;
    background: transparent;
    text-decoration: none;
  }

  #content .home-image-nav .home-nav-link::after {
    content: none;
    display: none;
  }

  #content .home-image-nav .home-nav-link:not(:hover):not(:focus-visible) > .home-nav-label {
    --link-highlight-color: #e5e7eb;
  }

  body.is-home #content .home-image-nav .home-nav-link,
  body.is-home #content .home-image-nav .home-nav-link:hover,
  body.is-home #content .home-image-nav .home-nav-link:focus-visible {
    background: transparent;
    text-decoration: none;
  }

  #content .home-image-nav .home-nav-link:is(.active, :hover, :focus-visible) {
    color: #111827;
  }

  #content .home-image-tools {
    position: absolute;
    inset: 0;
    z-index: 40;
    pointer-events: none;
  }

  #content .home-image-tools .site-search-toggle {
    position: absolute;
    top: 81%;
    transform: translate(-50%, -50%);
    pointer-events: auto;
    width: 44px;
    height: 44px;
    padding: 0;
    background: transparent;
  }

  #content .home-image-tools .toggle-theme {
    left: 26%;
  }

  #content .home-image-tools [data-site-search-open] {
    left: 88%;
  }

  #content .home-image-tools .theme-icon,
  #content .home-image-tools .site-search-icon {
    width: 2rem;
    height: 2rem;
  }

  @media (max-width: 911px) {
    #content .home-image-nav .home-nav-link {
      min-height: 1.625rem;
      padding: 0.15rem 0.3rem;
      font-size: 0.875rem;
    }

    #content .home-image-tools .site-search-toggle {
      width: 38px;
      height: 38px;
    }

    #content .home-image-tools .theme-icon,
    #content .home-image-tools .site-search-icon {
      width: 1.75rem;
      height: 1.75rem;
    }
  }

  @media print {
    #content .home-image-nav,
    #content .home-image-tools {
      display: none;
    }
  }
</style>
